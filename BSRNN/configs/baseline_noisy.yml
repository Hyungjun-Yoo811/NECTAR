# Baseline, noisy condition (Table 4): same as baseline.yml but mode:
# mix_both with DSM noise injection explicitly enabled (noise_prob/noise_dir/
# snr_range) -- noise_dir is Libri2Mix's own WHAM! clip pool. Validated on
# the static Libri2Mix mix_both dev set.

model:
  spk_emb_dim: 192
  sr: 16000
  win: 512
  stride: 128
  feature_dim: 128
  num_repeat: 6
  spk_fuse_type: 'multiply'
  use_spk_transform: False
  normalize_emb: True

campplus:
  ckpt_path: "~/.cache/modelscope/models/iic--speech_campplus_sv_zh_en_16k-common_advanced/snapshots/v1.0.0/campplus_cn_en_common.pt"

training:
  model_name: 'baseline_noisy'
  resume: False
  eval_interval: 1
  exp_dir: "exp/baseline_noisy"
  loss: 'sisdr'
  num_avg: 5
  accum_grad: 1

optim:
  optimizer: adam
  lr: 0.001
  final_lr: 0.00002
  weight_decay: 0.0001
  lr_schedule: 'exponential'
  lr_descend_factor: 0.98
  patience: 0
  stop_patience: 10
  max_epoch: 150

data:
  dsm: true
  sir_range: [-5.0, 5.0]
  noise_prob: 1.0
  noise_dir: "../dataset/data/Libri2Mix/wav16k/min/train-100/noise"
  snr_range: [0.0, 15.0]
  data_root: "../dataset/data/Libri2Mix/wav16k/min"
  librispeech_root: "../dataset/data/LibriSpeech"
  audio_length: 3
  enroll_len: 3
  sample_rate: 16000
  batch_size: 16
  num_workers: 16
  mode: 'mix_both'
  train_subset: ['train-100']
  valid_subset: 'dev'

distribute:
  distributed: True
  gpu_ids: [0]
master_port: 29620

eval:
  gpu_id: 0

grad_clipping:
  clip_grad: 5.0

wandb:
  enabled: True
  project: "BSRNN-CAM"
  name: "baseline_noisy"
